{% extends 'pizzas/base.html' %}

{% block content %}

  <p>Topics</p>
  
  <ul>
    {% for topic in topics %}
      <li>
        <a href="{% url 'pizzas:topic' topic.id %}">
          {{ topic.name }}</a>
      </li>
    {% empty %}
      <li>No topics have been added yet.</li>
    {% endfor %}
  </ul>

{% endblock content %}
