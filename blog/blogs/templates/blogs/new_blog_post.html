{% extends "blogs/base.html" %}

{% block content %}

  <p><a href="{% url 'blogs:blog' blog.id %}">{{ blog }}</a></p>

  <p>Add a new blog post:</p>
  <form action="{% url 'blogs:new_blog_post' blog.id %}" method="post">
    {% csrf_token %}
    {{ form.as_div}}
    <button name="submit">Add blog post</button>
  </form>

{% endblock content %}
